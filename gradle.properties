# Required because app/build.gradle.kts depends on androidx.security:security-crypto
# (used to encrypt the Dictionary Security Lock PIN, recovery email, and My
# Dictionary words at rest). Without this flag, Gradle refuses to build as soon as
# any AndroidX artifact is on the classpath - this is exactly what the CI build was
# failing on.
android.useAndroidX=true

# No legacy android.support.* libraries are used anywhere in this project, so there
# is nothing for Jetifier to rewrite. Leaving it off keeps the build a little faster.
android.enableJetifier=false
